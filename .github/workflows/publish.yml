name: Publish To PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: |
          python -m build
          python -m build packages/train --outdir dist
          python -m build packages/infer --outdir dist
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: veg-train --help
      - run: veg-infer --help
      - name: Test Delta Memory And Gradients
        working-directory: veg
        run: |
          python -m unittest test_delta_memory
          VEG_F64=1 python veg3.py --memory delta --gradcheck
          VEG_F64=1 python veg3.py --memory resonance --gradcheck
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - project: veg_core
            environment: pypi-veg-core
          - project: veg_train
            environment: pypi-veg-train
          - project: veg_infer
            environment: pypi-veg-infer
    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/p/veg-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Select One Project Per Scoped Token
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          mkdir publish
          cp dist/"${PROJECT}"-*.tar.gz publish/
          if [ "$PROJECT" != veg_core ]; then
            cp dist/"${PROJECT}"-*.whl publish/
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/
