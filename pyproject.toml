[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veg-core"
version = "0.2.0"
description = "Experimental phase-driven text generation with prediction-error memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/A-Proof/veg"
Repository = "https://github.com/A-Proof/veg"
Issues = "https://github.com/A-Proof/veg/issues"

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13"]
test = ["safetensors>=0.4"]

[tool.setuptools]
packages = ["veg"]
